<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Náhled · Dilemata AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect width='10' height='10' fill='%230f4e2f'/%3E%3Crect y='7' width='10' height='3' fill='%230bd26f'/%3E%3C/svg%3E" />
  </head>
  <body class="pv">
    <main class="pv-main">
      <div class="pv-frame">
        <div id="stage" class="stage"></div>
        <button class="pv-hit prev" id="hit-prev" type="button" aria-label="Předchozí slide"></button>
        <button class="pv-hit next" id="hit-next" type="button" aria-label="Další slide"></button>
      </div>
    </main>
    <nav class="pv-bar">
      <button id="prev" type="button" aria-label="Předchozí">←</button>
      <span id="pos" class="pv-pos"></span>
      <button id="next" type="button" aria-label="Další">→</button>
      <span id="sec" class="pv-sec"></span>
      <button id="notes-btn" type="button">Poznámky</button>
      <button id="full" type="button">Celá obrazovka</button>
    </nav>
    <aside id="notes" class="pv-notes" hidden></aside>
    <script type="module" src="../src/pages/preview.ts"></script>
  </body>
</html>
